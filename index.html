<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренировочный план</title>
<meta name="apple-mobile-web-app-title" content="Тренировочный план">
<meta name="description" content="Дневник тренировок с монстрами">
<meta name="theme-color" content="#0b0a09">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-180.png">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="lvl" id="lvlBtn" aria-label="Герой"><span>ур.</span><b id="lvl">1</b></button>
  <div class="xp"><span id="xpTxt">Странник · 0 / 200</span><div class="bar"><i id="xpBar"></i></div></div>
  <button class="syncdot" id="syncBtn" aria-label="Синхронизация"><i></i></button>
</header>
<main id="main"></main>
<nav class="tabs" role="tablist">
  <a href="#/battle" data-tab="battle">Бой</a>
  <a href="#/journey" data-tab="journey">Поход</a>
  <a href="#/progress" data-tab="progress">Прогресс</a>
  <a href="#/hero" data-tab="hero">Герой</a>
</nav>
<div class="sheet" id="sheet" hidden>
  <div class="in">
    <!-- Своя цифровая клавиатура: системная не открывается, и полоска автозаполнения Chrome не мешает. -->
    <div class="sheethead"><div class="t" id="sheetTitle"></div><button class="ghostbtn" id="sheetClear">Стереть</button></div>
    <div class="step">
      <button id="minus" aria-label="Минус один">−</button>
      <input id="sheetVal" inputmode="none" readonly autocomplete="off" aria-label="Повторы">
      <button id="plus" aria-label="Плюс один">+</button>
      <button class="okbtn" id="sheetOk" aria-label="Готово">✓</button>
    </div>
    <div class="pad" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k=",">,</button><button data-k="0">0</button><button data-k="del" aria-label="Стереть цифру">⌫</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
